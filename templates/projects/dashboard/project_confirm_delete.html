{% extends "base.html" %}

{% block title %}Delete: {{ project.title }}{% endblock %}

{% block content %}
<section class="dashboard" id="delete-section">
    <div class="container container--narrow">
        <div class="glass-card delete-confirm">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" width="48" height="48" class="delete-icon">
                <path d="M3 6h18M19 6v14a2 2 0 01-2 2H7a2 2 0 01-2-2V6m3 0V4a2 2 0 012-2h4a2 2 0 012 2v2"/>
                <line x1="10" y1="11" x2="10" y2="17"/><line x1="14" y1="11" x2="14" y2="17"/>
            </svg>
            <h1 class="delete-title">Delete "{{ project.title }}"?</h1>
            <p class="delete-text">This action cannot be undone. The project and its uploaded image will be permanently removed.</p>

            <form method="post" id="delete-form">
                {% csrf_token %}
                <div class="form-actions">
                    <button type="submit" class="btn btn--danger btn--lg">Yes, Delete</button>
                    <a href="{% url 'dashboard_list' %}" class="btn btn--ghost">Cancel</a>
                </div>
            </form>
        </div>
    </div>
</section>
{% endblock %}
